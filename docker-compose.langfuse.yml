# Langfuse v3 自托管部署（可选组件，与应用主体解耦）。
# 用法：docker compose -f docker-compose.langfuse.yml up -d
# 启动后在 .env 或环境变量中配置：
#   LANGFUSE_HOST=http://localhost:3000
#   LANGFUSE_PUBLIC_KEY=pk-lf-...
#   LANGFUSE_SECRET_KEY=sk-lf-...
# 不需要 Langfuse 时不启动本文件即可，应用侧自动降级为本地模式。

services:
  langfuse-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.3
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
      CLICKHOUSE_DB: default
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse

  langfuse-redis:
    image: redis:7-alpine
    restart: unless-stopped

  langfuse-minio:
    image: minio/minio:latest
    restart: unless-stopped
    entrypoint: sh
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: langfuse
    volumes:
      - langfuse-minio-data:/data

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on: [langfuse-postgres, langfuse-clickhouse, langfuse-redis, langfuse-minio]
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: langfuse-nextauth-secret-change-me
      SALT: langfuse-salt-change-me
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
      LANGFUSE_INGEST_QUEUE_PREFIX: langfuse
      REDIS_URL: redis://langfuse-redis:6379
      S3_ENDPOINT: http://langfuse-minio:9000
      S3_BUCKET: langfuse
      S3_ACCESS_KEY_ID: langfuse
      S3_SECRET_KEY: langfuse
      S3_FORCE_PATH_STYLE: "true"
      TELEMETRY_ENABLED: "false"

  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    depends_on: [langfuse-worker]
    ports:
      - "3000:3000"
    environment:
      <<: *langfuse-env
      PORT: "3000"

volumes:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-minio-data:
